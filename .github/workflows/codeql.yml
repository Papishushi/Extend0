name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '43 8 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Build the real project graph instead of Extend0.sln. The solution still
      # contains legacy projects that are no longer present in the repository,
      # and NuGet solution restore misses Extend0.TestProcessHost because it is
      # referenced by the tests but is not itself listed in the solution.
      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore Extend0.Tests/Extend0.Tests.csproj
          dotnet restore Extend0.BlittableAdapter.Generator/Extend0.BlittableAdapter.Generator.csproj

      - name: Build projects
        shell: pwsh
        run: |
          dotnet build Extend0.Tests/Extend0.Tests.csproj --configuration Release --no-restore
          dotnet build Extend0.BlittableAdapter.Generator/Extend0.BlittableAdapter.Generator.csproj --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
